apiVersion: apps/v1
kind: Deployment
metadata:
  name: pawhome-web
  namespace: pawhome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pawhome-web
  template:
    metadata:
      labels:
        app: pawhome-web
    spec:
      containers:
        - name: pawhome-web
          image: ghcr.io/ialexbpl/pawhome:20260531-1421-59cf2fc
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: 192.168.5.15
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: pawhome
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pawhome-postgres-secret
                  key: POSTGRES_PASSWORD
          startupProbe:
            httpGet:
              path: /
              port: 5000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pawhome-web
  namespace: pawhome
  # Uncomment and set your pool name if needed:
  # annotations:
  #   metallb.io/address-pool: your-pool-name
spec:
  type: LoadBalancer
  selector:
    app: pawhome-web
  ports:
    - name: http
      port: 80
      targetPort: 5000
