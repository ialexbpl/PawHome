apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pawhome
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ialexbpl/PawHome.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: pawhome
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
